name: Update AI and jobs data

# Refreshes data/ai_jobs.json from Statistics Norway (table 11658).
# Runs every Monday and commits when SSB has published new data. It also records the month of the
# last check in data/last_checked.txt (one commit a month), because GitHub pauses scheduled
# workflows in repositories with no activity for 60 days.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-ai-jobs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild data/ai_jobs.json from SSB
        run: python scripts/update_ai_jobs.py
      - name: Record the check (monthly, keeps the schedule active)
        run: date -u +%Y-%m > data/last_checked.txt
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/ai_jobs.json data/last_checked.txt && [ -z "$(git status --porcelain -- data/last_checked.txt)" ]; then
            echo "No new SSB data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/ai_jobs.json data/last_checked.txt
          if git diff --cached --quiet -- data/ai_jobs.json; then msg="Monthly SSB check (no new data)"; else msg="Update AI and jobs data from SSB table 11658"; fi
          git commit -m "$msg"
          git push
